# CRNET nginx module matrix for instrumentation-nginx fat agent image.
# Gradle reads nginxSupportedVersions and builds one ngx_http_opentelemetry_module.so
# per exact semver under WebServerModule/Nginx/{version}/.
# Must match agent-backend/api-backend nginx_compat.go crnet-1.1.0 release.
server-module-version=1.0.3
release=GA
nginxSupportedVersions=1.24.0,1.25.3,1.25.5,1.26.0,1.26.2,1.27.3,1.27.4,1.28.0,1.29.0,1.30.0,1.31.0,1.31.4
CPP-SDK-version=1.2.0
